<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korea Holiday Plan — 연차로 더 긴 연휴 만들기</title>
  <link rel="stylesheet" href="styles.css" />
<script data-goatcounter="https://commitsip.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script><meta name="description" content="Korea Holiday Plan"></head>
<body><div id="cs-bar" style="position:sticky;top:0;z-index:2147483647;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 14px;background:#eaf5ff;color:#0b2545;font:600 14px/1.4 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;border-bottom:1px solid #cfe6fb"><span><a href="../" style="color:#0369a1;text-decoration:none">← 커밋 한 모금 앱 실험실</a> · AI가 만든 초안이에요(실수가 있을 수 있어요)</span><a href="mailto:syg4006@gmail.com?subject=앱 의뢰: Korea Holiday Plan 같은 앱" style="color:#fff;background:#0284c7;padding:6px 12px;border-radius:8px;text-decoration:none">이런 앱 의뢰하기</a></div>
  <div class="layout">
    <header class="app-header">
      <h1 class="app-title">Korea Holiday Plan</h1>
      <p class="app-subtitle">한국 공휴일과 주말에 연차를 붙여 가장 긴 연속 휴가 후보를 보여 줍니다.</p>
      <nav class="nav" aria-label="화면 이동">
        <button id="nav-plan" class="nav-button" type="button" aria-pressed="true">휴가 계획</button>
        <button id="nav-saved" class="nav-button" type="button" aria-pressed="false">저장한 후보</button>
        <button id="nav-data" class="nav-button" type="button" aria-pressed="false">데이터 관리</button>
      </nav>
    </header>

    <p id="app-status" role="status" class="app-status"></p>

    <main>
      <section id="screen-plan" class="screen card">
        <h2>휴가 계획 만들기</h2>
        <div class="controls">
          <label class="control">
            <span class="control-label">연차 일수 <output id="leave-value">5일</output></span>
            <input id="leave-slider" type="range" min="0" max="7" step="1" value="5" />
          </label>
          <label class="control">
            <span class="control-label">기준 날짜</span>
            <input id="today-input" type="date" />
          </label>
          <button id="example-button" class="primary" type="button">예시로 해 보기</button>
        </div>
        <ol id="card-list" class="card-list" aria-live="polite"></ol>
      </section>

      <section id="screen-saved" class="screen card" hidden>
        <h2>저장한 후보 목록</h2>
        <ul id="saved-list" class="saved-list"></ul>
      </section>

      <section id="screen-data" class="screen card" hidden>
        <h2>데이터 정보</h2>
        <p id="data-time" class="data-time"></p>
        <p id="data-terms" class="data-terms"></p>
        <div class="data-actions">
          <button id="export-button" class="primary" type="button">내보내기</button>
          <label class="file-label">가져오기
            <input id="import-file" type="file" accept=".json,application/json" />
          </label>
          <button id="reset-button" class="danger" type="button">초기화</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="src/main.js"></script>

</body>
</html>
