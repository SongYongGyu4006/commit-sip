<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원화 코인 대시보드 krcoinfx — 무료 웹 도구 · 커밋 한 모금</title>
<link rel="stylesheet" href="styles.css">
<script data-goatcounter="https://commitsip.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script><meta name="description" content="비트코인·이더리움(필요 시 솔라나)의 원화 가격과 24시간 변동을 달러 변동과 환율 효과로 나눠 보여 주는 원화 기준 코인 대시보드입니다."><link rel="canonical" href="https://songyonggyu4006.github.io/commit-sip/apps/krw-crypto-dashboard/"></head>
<body><div id="cs-bar" style="position:sticky;top:0;z-index:2147483647;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 14px;background:#f6efe6;color:#3b2418;font:600 14px/1.4 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;border-bottom:1px solid #e3d2bc"><span><a href="../" style="color:#8a5524;text-decoration:none">← 커밋 한 모금 앱 실험실</a> · <a href="guide.html" style="color:#8a5524">쓰는 법</a> · AI가 만든 초안이에요(실수가 있을 수 있어요)</span><a href="mailto:syg4006@gmail.com?subject=앱 의뢰: 원화 코인 대시보드 같은 앱" style="color:#fff;background:#c8873f;padding:6px 12px;border-radius:8px;text-decoration:none">이런 앱 의뢰하기</a></div>
<div class="wrap">
  <header class="app-head">
    <h1>원화 코인 대시보드</h1>
    <p class="tagline">비트코인·이더리움의 원화 가격과 24시간 변동을 달러 변동·환율 효과와 함께 보여 줍니다</p>
  </header>

  <nav class="topnav">
    <button id="nav-dashboard" class="nav-btn active" type="button">대시보드</button>
    <button id="nav-coins" class="nav-btn" type="button">코인 선택</button>
    <button id="nav-backup" class="nav-btn" type="button">백업</button>
  </nav>

  <p id="app-status" role="status"></p>

  <main>
    <section id="screen-dashboard">
      <h2>원화 코인 대시보드</h2>
      <div class="card">
        <p id="fx-line"></p>
        <p id="data-time"></p>
      </div>
      <ul id="coin-list"></ul>
      <p id="source-line" class="source-line"></p>
      <button id="example-button" class="primary" type="button">예시로 해 보기</button>
    </section>

    <section id="screen-coins" hidden>
      <h2>코인 선택</h2>
      <div class="card">
        <p>비트코인과 이더리움은 항상 표시됩니다. 추가할 코인을 고르면 대시보드가 다시 그려집니다.</p>
        <label for="extra-coin">추가 코인</label>
        <select id="extra-coin">
          <option value="">추가 코인 없음</option>
          <option value="solana">솔라나</option>
        </select>
      </div>
    </section>

    <section id="screen-backup" hidden>
      <h2>백업과 복원</h2>
      <div class="card">
        <p>현재 코인 선택을 krcoinfx.json 파일로 내보내고, 같은 형식 파일을 가져와 복원할 수 있습니다.</p>
        <div class="btn-row">
          <button id="export-button" class="primary" type="button">내보내기 (krcoinfx.json)</button>
          <label class="import-label" for="import-file">내보내신 krcoinfx.json을 선택하세요</label>
          <input id="import-file" class="import-input" type="file" accept=".json" title="krcoinfx.json 가져오기">
          <button id="reset-button" type="button">선택 초기화</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script type="module" src="src/main.js"></script>

</body>
</html>
